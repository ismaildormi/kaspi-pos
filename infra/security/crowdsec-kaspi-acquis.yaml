# KASPI POS — CrowdSec Acquisition & Bouncer Configuration (Layer 6)
# Place in /etc/crowdsec/acquis.d/kaspi-pos.yaml
filenames:
  - /var/log/nginx/kaspi-access.log
  - /var/log/nginx/kaspi-error.log
  - /var/log/kaspi-pos/security-forensic.log
labels:
  type: nginx
---
source: journalctl
journalctl_filter:
  - "_SYSTEMD_UNIT=kaspi-pos.service"
labels:
  type: kaspi-nextjs-waf

# KASPI POS — Fail2Ban Jail & Filter Configuration (Layer 6)
# Place in /etc/fail2ban/jail.d/kaspi-pos.local

[kaspi-auth-bruteforce]
enabled = true
port = http,https
filter = kaspi-auth-bruteforce
logpath = /var/log/nginx/kaspi-access.log
maxretry = 5
findtime = 120
bantime = 3600
action = %(action_mwl)s

[kaspi-waf-sqli-xss]
enabled = true
port = http,https
filter = kaspi-waf-sqli-xss
logpath = /var/log/nginx/kaspi-access.log
maxretry = 2
findtime = 300
bantime = 86400
action = %(action_mwl)s

name: Release All Platforms (.exe, .msi, .dmg, .AppImage, .apk, .ipa)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  wsl-cargo-xwin-check:
    name: Cross-Check Windows Target via cargo-xwin
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install cargo-xwin & validate Tauri Windows binary target
        run: |
          cargo install --locked cargo-xwin || true
          if command -v cargo-xwin >/dev/null 2>&1; then
            cd src-tauri && cargo xwin check --target x86_64-pc-windows-msvc
          fi

  build-desktop-tauri:
    name: Tauri Multi-OS (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: "--bundles appimage,deb"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Install Ubuntu WebKit & GTK system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf pkg-config libssl-dev
      - run: npm install --legacy-peer-deps
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "HEYUKA & KASPI POS v__VERSION__"
          releaseBody: "Multi-OS release bundles (.exe/.msi, Universal .dmg, Linux .AppImage)."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  build-mobile-android-apk:
    name: Build Android APK (Capacitor + Gradle)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Scaffold Capacitor Web-Wrapper APK for kaspi-pos.vercel.app
        run: |
          mkdir -p /tmp/heyuka-mobile && cd /tmp/heyuka-mobile
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "HEYUKA KASPI" "ma.kaspi.heyuka" --web-dir www
          mkdir -p www && printf '<!doctype html><html><head><meta http-equiv="refresh" content="0;url=https://kaspi-pos.vercel.app/en/heyuka"></head><body>Launching HEYUKA...</body></html>' > www/index.html
          npx cap add android
          sed -i 's|"server": {}|"server": {"url": "https://kaspi-pos.vercel.app/en/heyuka", "cleartext": false}|g' capacitor.config.json || true
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: HEYUKA-Android-debug.apk
          path: /tmp/heyuka-mobile/android/app/build/outputs/apk/debug/*.apk

  build-mobile-ios-unsigned-ipa:
    name: Build Unsigned iOS IPA (AltStore / Capacitor)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Scaffold Capacitor Unsigned iOS Bundle
        run: |
          mkdir -p /tmp/heyuka-ios && cd /tmp/heyuka-ios
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          npx cap init "HEYUKA KASPI" "ma.kaspi.heyuka" --web-dir www
          mkdir -p www && printf '<!doctype html><html><head><meta http-equiv="refresh" content="0;url=https://kaspi-pos.vercel.app/en/heyuka"></head><body>Launching HEYUKA...</body></html>' > www/index.html
          npx cap add ios
          cd ios/App && xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          mkdir -p Payload && cp -R build/Release-iphoneos/App.app Payload/ && zip -r /tmp/HEYUKA-iOS-Unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: HEYUKA-iOS-Unsigned.ipa
          path: /tmp/HEYUKA-iOS-Unsigned.ipa

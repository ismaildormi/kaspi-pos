name: Build Windows Desktop Installer (.exe / .msi)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Tauri Windows Binary
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Prepare Tauri Icons & Frontend Shell
        run: |
          if (!(Test-Path "out")) { New-Item -ItemType Directory -Path "out" -Force }
          Set-Content -Path "out/index.html" -Value "<!DOCTYPE html><html><head><meta charset='utf-8'><title>Kasbi POS</title></head><body style='background:#09090b;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0'><h1>KASPI POS Desktop v2.0</h1></body></html>"
          npx @tauri-apps/cli@2 icon public/logo.png

      - name: Build Tauri Desktop App (.exe and .msi)
        run: npx @tauri-apps/cli@2 build
        env:
          CI: true

      - name: Upload Windows .exe and .msi to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: KASPI POS v2.0.0 (Windows Desktop Edition)
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Installer Artifacts (Workflow Dispatch)
        uses: actions/upload-artifact@v4
        with:
          name: kaspi-pos-windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

# KASPI POS — 24/7 Free Autonomous Self-Healing Fleet Operator (Phase 3)
# Runs 100% FREE on GitHub Actions every 6 hours and on every push to main.
name: KASPI Autonomous Fleet Operator (24/7)

on:
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  autonomous-fleet-sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Agent #11 — Secret & Credential Leak Guard
        run: node scripts/security/secret-scan.mjs

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Agent #06/#12 — Strict TypeScript & Schema Verification
        run: npx tsc --noEmit

      - name: Agent #12 — Trigger Production 12-Agent Self-Healing Sweep (if configured)
        env:
          KASPI_PRODUCTION_URL: ${{ secrets.KASPI_PRODUCTION_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -n "$KASPI_PRODUCTION_URL" ]; then
            echo "Triggering 12-Agent Self-Healing Fleet Matrix sweep on $KASPI_PRODUCTION_URL..."
            STATUS=$(curl -s -o /tmp/fleet_report.json -w "%{http_code}" \
              -X POST "$KASPI_PRODUCTION_URL/api/autonomous/fleet-matrix" \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json" \
              -d '{"action":"sweep"}')
            echo "Fleet Matrix HTTP Status: $STATUS"
            cat /tmp/fleet_report.json || true
            if [ "$STATUS" -ge 500 ]; then
              echo "Degraded response detected — triggering billing & sync recovery..."
              curl -s -X POST "$KASPI_PRODUCTION_URL/api/automation/billing-cron" \
                -H "Authorization: Bearer $CRON_SECRET" || true
            fi
          else
            echo "KASPI_PRODUCTION_URL secret not set — local CI verification completed cleanly."
          fi

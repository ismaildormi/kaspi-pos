# HEYUKA Cloud Resumable Public-Web Study & Curation Loop ($0.00 Free Tier)
# Runs every 6 hours on GitHub Actions using actions/cache to persist the SQLite URL frontier
# and checkpoint cursor across scheduled runs, strictly respecting robots.txt, SSRF guards & PII scrubbing.
name: HEYUKA Eternal Public Study Loop (24/7)

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-web-study:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore persistent URL frontier & checkpoint cursor
        uses: actions/cache@v4
        with:
          path: ~/.heyuka-frontier
          key: heyuka-frontier-${{ github.run_id }}
          restore-keys: |
            heyuka-frontier-

      - name: Run autonomous public-web batch discoverer (robots.txt + SSRF + rate-limit polite)
        run: |
          mkdir -p ~/.heyuka-frontier
          python3 training/crawler/autonomous_web_discoverer.py \
            --batch-size 120 \
            --db-file ~/.heyuka-frontier/frontier_queue.sqlite \
            --state-file ~/.heyuka-frontier/eternal_frontier_state.json \
            --out /tmp/heyuka_public_raw.jsonl

      - name: Deduplicate & scrub PII from public corpus
        run: |
          python3 training/ingestion/massive_curator.py \
            --in /tmp/heyuka_public_raw.jsonl \
            --out-cpt /tmp/heyuka_public_cpt.jsonl \
            --out-sft /tmp/heyuka_public_sft.jsonl

      - name: Archive curated public dataset shard & frontier checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: heyuka-public-study-corpus
          path: |
            /tmp/heyuka_public_cpt.jsonl
            /tmp/heyuka_public_sft.jsonl
            ~/.heyuka-frontier/eternal_frontier_state.json
          retention-days: 14

      - name: Trigger vault digest check on live deployment (if configured)
        env:
          KASPI_PRODUCTION_URL: ${{ secrets.KASPI_PRODUCTION_URL }}
        run: |
          BASE_URL="${KASPI_PRODUCTION_URL:-https://kaspi-pos.vercel.app}"
          curl -sS -X POST "$BASE_URL/api/v1/studio/ingest" \
            -H "Content-Type: application/json" \
            -d '{"action":"digest_vault"}' | head -c 500
